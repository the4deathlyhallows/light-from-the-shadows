title: Obfuscated VBScript Spawning PowerShell with Hidden Window
id: 9b2f7d1b-3c4d-4a9f-8f2b-2a3b4c5d6e72
status: experimental
description: |
  Detects WScript/CScript launching PowerShell with hidden-window and encoded-command
  flags, matching the AHK loader campaign's decode chain (obfuscated VBS -> PowerShell ->
  C# payload fetched from a Pastebin-like host) that ultimately installs LimeRAT/AsyncRAT.
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1059.005
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
    selection_child:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flags:
        CommandLine|contains:
            - '-enc '
            - '-EncodedCommand'
            - '-e '
            - '-nop'
            - '-noni'
            - '-w hidden'
            - '-windowstyle hidden'
            - 'IEX'
            - 'Invoke-Expression'
            - 'DownloadString'
            - 'DownloadData'
            - 'FromBase64String'
    condition: selection_parent and selection_child and selection_flags
falsepositives:
    - Legitimate admin or deployment scripts that call PowerShell from a VBS wrapper.
      Rare outside packaged installers; verify parent script origin and signer.
level: high
