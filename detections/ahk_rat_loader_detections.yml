title: AutoHotkey Compiled Script Spawning Script Interpreter
id: 7a1e6f0a-2b3c-4b8e-9e1a-1f2a3b4c5d61
status: experimental
description: |
  Detects a compiled AutoHotkey (AHK) executable spawning WScript/CScript or PowerShell.
  Reported by Morphisec (May 2021) as the initial stage of a multi-variant RAT delivery
  campaign (Revenge RAT, LimeRAT, AsyncRAT, Houdini, Vjw0rm) using AHK-compiled loaders
  that drop and execute VBScript, which in turn loads a PowerShell stage.
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.execution
    - attack.t1059.005
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    parent_ahk:
        ParentImage|endswith:
            - '\AutoHotkey.exe'
            - '\AutoHotkeyU32.exe'
            - '\AutoHotkeyU64.exe'
            - '\AutoHotkeyA32.exe'
        ParentCommandLine|contains: '.ahk'
    parent_ahk_compiled:
        # Compiled AHK EXEs embed the AutoHotkey interpreter; many retain PE metadata
        # referencing AutoHotkey even when renamed to masquerade as a legitimate app.
        ParentCommandLine|contains: 'AutoHotkey'
    child_script:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: (parent_ahk or parent_ahk_compiled) and child_script
falsepositives:
    - Legitimate internal tooling built with AutoHotkey that intentionally shells out to
      WScript/PowerShell. Baseline known business use before enabling in blocking mode.
level: high
