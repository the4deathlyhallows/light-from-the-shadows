title: Windows Defender Tampering via Script or Registry
id: 5e6f7a8b-9c0d-41e2-af3f-5c6d7e8f9a94
status: experimental
description: |
  Detects commands that disable Microsoft Defender real-time protection or stop the
  WinDefend service, matching one AHK loader variant that dropped a Batch script (invoked
  via an LNK) to disable Defender before installing the RAT payload.
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.defense-evasion
    - attack.t1562.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_ps:
        CommandLine|contains|all:
            - 'Set-MpPreference'
            - 'DisableRealtimeMonitoring'
    selection_sc_stop:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - 'stop WinDefend'
            - 'config WinDefend start= disabled'
    selection_reg:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
            - 'Windows Defender'
        CommandLine|contains|any:
            - 'DisableAntiSpyware'
            - 'DisableRealtimeMonitoring'
            - 'DisableAntiVirus'
    selection_taskkill:
        Image|endswith: '\taskkill.exe'
        CommandLine|contains: 'MsMpEng'
    condition: 1 of selection_*
falsepositives:
    - Authorized EDR/AV migration scripts run by IT. Should be rare and change-controlled;
      alert on any instance outside approved maintenance windows.
level: high
---
title: Shortcut (LNK) File Created Pointing to Batch Script
id: 8f9a0b1c-2d3e-44f5-9a6b-6d7e8f9a0b15
status: experimental
description: |
  Detects creation of a .lnk shortcut whose target is a .bat/.cmd file, a pattern the AHK
  loader campaign used to trigger a Defender-disabling Batch script (often staged from a
  compiled AHK dropper into Temp/AppData or the Startup folder).
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.persistence
    - attack.t1547.009
    - attack.execution
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '.lnk'
    filter_path:
        TargetFilename|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Startup\'
    condition: selection and filter_path
falsepositives:
    - Many legitimate installers create Startup/AppData shortcuts. Best used correlated
      with Sysmon EventID 15 (LNK target metadata) or combined with the Defender-tampering
      rule in this pack for higher fidelity.
level: low
---
title: Hosts File Modified to Block Antivirus Domains
id: 1a2b3c4d-5e6f-47a8-8b9c-7e8f9a0b1c26
status: experimental
description: |
  Detects modification of the Windows hosts file, used in the AHK loader campaign to
  sinkhole AV vendor domains to localhost and block cloud-based detection/updates.
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.defense-evasion
    - attack.t1562.001
    - attack.t1565.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '\drivers\etc\hosts'
    filter_main:
        Image|endswith:
            - '\notepad.exe'
            - '\notepad++.exe'
            - '\code.exe'
    condition: selection and not filter_main
falsepositives:
    - IT admins or endpoint management tools editing hosts for legitimate blocklisting.
      Diff the file contents against baseline; flag additions resolving AV/security
      vendor domains to 127.0.0.1 or 0.0.0.0.
level: medium
