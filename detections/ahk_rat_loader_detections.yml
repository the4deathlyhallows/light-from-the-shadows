title: PowerShell Fetching In-Memory Loader Consistent With HCrypt/AsyncRAT Stage
id: 4b5c6d7e-8f9a-40b1-9c2d-8f9a0b1c2d37
status: experimental
description: |
  Detects PowerShell reflectively loading .NET assemblies in memory after a download
  cradle, consistent with the AHK loader's HCrypt-packed AsyncRAT stage (VBS drops an
  in-memory PowerShell script that fetches and loads the RAT without touching disk).
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.defense-evasion
    - attack.t1055
    - attack.t1620
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_proc:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_reflection:
        CommandLine|contains|all:
            - '[Reflection.Assembly]'
            - 'Load'
    selection_memstream:
        CommandLine|contains|any:
            - '[System.Convert]::FromBase64String'
            - 'IO.MemoryStream'
            - 'Net.WebClient'
    condition: selection_proc and (selection_reflection or selection_memstream)
falsepositives:
    - Legitimate PowerShell modules that use reflection for signed, known internal tools.
      Correlate with process ancestry (wscript/cscript parent) for higher confidence.
level: high
---
title: PowerShell Script Block Builds HttpWebRequest Download Cradle to Stikked.ch
id: 6c7d8e9f-0a1b-42c3-ad4e-9f0a1b2c3d48
status: experimental
description: |
  Detects the deobfuscated PowerShell logic used by the AHK loader's VBS dropper: a
  System.Net.HttpWebRequest download cradle that reads a stikked.ch paste and pipes it
  to IEX. Requires PowerShell Script Block Logging (Event ID 4104) enabled, since the
  VBS wrapper builds this string at runtime via StrReverse() and never writes it to disk
  or a visible process command line in plaintext.
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1059.005
    - attack.defense-evasion
    - attack.t1027
    - attack.command-and-control
    - attack.t1105
logsource:
    category: ps_script
    product: windows
    definition: 'Requires PowerShell Script Block Logging (Microsoft-Windows-PowerShell/Operational, Event ID 4104)'
detection:
    selection_cradle:
        ScriptBlockText|contains|all:
            - 'HttpWebRequest'
            - 'GetResponseStream'
            - 'IEX'
    selection_host:
        ScriptBlockText|contains: 'stikked.ch'
    condition: selection_cradle or selection_host
falsepositives:
    - Rare. HttpWebRequest + GetResponseStream + IEX chained together is an uncommon
      combination outside malicious download cradles; treat hits as high-confidence.
level: critical
---
title: Obfuscated VBScript Using StrReverse-Based Decode-and-Execute Pattern
id: 2d3e4f5a-1b2c-43d4-be5f-0a1b2c3d4e59
status: experimental
description: |
  Detects VBScript source containing the AHK loader campaign's signature obfuscation:
  repeated StrReverse() calls feeding Execute(), combined with a custom Chr(Asc(Mid(...)))
  character-shift decoder used to reconstruct variable names and a PowerShell download
  cradle at runtime. This is a static/content-based rule intended for AMSI content
  logging, EDR script-content telemetry, or file-scanning pipelines rather than
  process-creation logs (the malicious string never appears in plaintext on the
  command line).
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.execution
    - attack.t1059.005
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: file_event
    product: windows
    definition: 'Intended for AMSI/script-content or file-scanning telemetry (e.g. Sysmon FileCreate + content scan, EDR script logging), not raw process_creation'
detection:
    selection_execute_reverse:
        FileContent|contains: 'Execute(StrReverse('
    selection_reverse_count:
        FileContent|contains: 'StrReverse('
    selection_char_decoder:
        FileContent|contains|all:
            - 'Chr(Asc(Mid('
    condition: selection_execute_reverse and selection_char_decoder
falsepositives:
    - Very low. This exact combination (Execute+StrReverse+custom Chr/Asc decoder) is a
      niche obfuscation style rarely seen in legitimate VBScript. A companion YARA rule
      (ahk_loader_vbs_obfuscation.yar) is provided for environments without a Sigma
      file-content backend.
level: critical
