title: Ingress Tool Transfer From Paste-Style Hosting Service
id: 3c4d5e6f-7a8b-49c0-9d1e-3b4c5d6e7f83
status: experimental
description: |
  Detects PowerShell or script interpreters retrieving payloads from Pastebin-style raw
  text hosting services (e.g. stikked.ch, pastebin.com, paste.ee, hastebin, rentry.co).
  The AHK loader campaign used stikked.ch to host a Base64/obfuscated C# stage that
  deploys the final RAT.
references:
    - https://blog.morphisec.com/ahk-rat-loader-leveraged-in-unique-delivery-campaigns
    - https://thehackernews.com/2021/05/experts-warn-about-ongoing-autohotkey.html
author: Detection Engineering
date: 2026-08-04
tags:
    - attack.command-and-control
    - attack.t1105
    - attack.t1071.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_proc:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\curl.exe'
            - '\bitsadmin.exe'
            - '\certutil.exe'
    selection_hosts:
        CommandLine|contains:
            - 'stikked.ch'
            - 'pastebin.com/raw'
            - 'paste.ee'
            - 'hastebin.com'
            - 'rentry.co'
            - 'controlc.com'
    condition: selection_proc and selection_hosts
falsepositives:
    - Developers legitimately fetching gists/snippets. Investigate destination content
      and downstream process activity before treating as benign.
level: medium
